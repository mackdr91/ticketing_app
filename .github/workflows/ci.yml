# Author: Domonick Mack
# Date: 2026-11-15
# Description: GitHub Actions CI/CD workflow for automated linting, type-checking, unit testing, and Next.js build verification.

name: PulseDesk CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsedesk
          POSTGRES_PASSWORD: pulsedesk_secret
          POSTGRES_DB: pulsedesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://pulsedesk:pulsedesk_secret@localhost:5432/pulsedesk_test?schema=public"
      JWT_SECRET: "ci-test-jwt-secret-key-2026"
      UPLOAD_DIR: "./uploads"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & push schema
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run automated test suite
        run: npm run test

      - name: Verify Next.js production build
        run: npm run build
