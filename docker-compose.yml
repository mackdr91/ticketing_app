# Author: Domonick Mack
# Date: 2026-11-15
# Description: Docker Compose orchestration for local development and testing with PostgreSQL 16 and PulseDesk app.

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsedesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsedesk
      POSTGRES_PASSWORD: pulsedesk_secret
      POSTGRES_DB: pulsedesk
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsedesk -d pulsedesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulsedesk-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://pulsedesk:pulsedesk_secret@postgres:5432/pulsedesk?schema=public"
      JWT_SECRET: "pulsedesk-super-secret-jwt-signing-key-2026"
      UPLOAD_DIR: "/app/uploads"
      NEXT_PUBLIC_APP_NAME: "PulseDesk"
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
